<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Dashboard — FundFlow</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="../assets/css/style.css" rel="stylesheet">
</head>
<body>
<script>window.FF_BASE = "../";</script>
<div id="ff-nav"></div>

<div class="container py-5">
  <h1 class="ff-display mb-4">Platform overview</h1>
  <div id="stats" class="row g-3 mb-5"><p class="text-secondary">Loading…</p></div>

  <div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="mb-0">Pending review</h4>
    <a href="campaigns.html">Go to verification queue</a>
  </div>
  <div id="pending"><p class="text-secondary">Loading…</p></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/nav.js"></script>
<script>
  FundFlowApi.requireRole("ADMIN");

  (async function () {
    try {
      const s = await FundFlowApi.get("/admin/stats");
      document.getElementById("stats").innerHTML = `
        <div class="col-md-2"><div class="ff-card p-3 text-center"><div class="ff-stat-num" style="font-size:1.7rem">${s.totalUsers}</div><div class="ff-stat-label">users</div></div></div>
        <div class="col-md-2"><div class="ff-card p-3 text-center"><div class="ff-stat-num" style="font-size:1.7rem">${s.totalCampaigns}</div><div class="ff-stat-label">campaigns</div></div></div>
        <div class="col-md-2"><div class="ff-card p-3 text-center"><div class="ff-stat-num" style="font-size:1.7rem">${s.pendingCampaigns}</div><div class="ff-stat-label">pending</div></div></div>
        <div class="col-md-2"><div class="ff-card p-3 text-center"><div class="ff-stat-num" style="font-size:1.7rem">${s.approvedCampaigns}</div><div class="ff-stat-label">approved</div></div></div>
        <div class="col-md-2"><div class="ff-card p-3 text-center"><div class="ff-stat-num" style="font-size:1.7rem">${s.totalSuccessfulDonations}</div><div class="ff-stat-label">donations</div></div></div>
        <div class="col-md-2"><div class="ff-card p-3 text-center"><div class="ff-stat-num" style="font-size:1.7rem">$${s.totalTransactionAmount}</div><div class="ff-stat-label">raised platform-wide</div></div></div>
      `;

      const pending = await FundFlowApi.get("/campaigns/admin/pending");
      const pendingBox = document.getElementById("pending");
      if (!pending.length) {
        pendingBox.innerHTML = '<div class="ff-empty">Nothing waiting for review.</div>';
      } else {
        pendingBox.innerHTML = pending.slice(0, 5).map(c => `
          <div class="ff-card p-3 mb-2 d-flex justify-content-between align-items-center">
            <div>${c.title}</div>
            <a href="campaigns.html?focus=${c.id}" class="btn btn-ff-outline btn-sm">Review</a>
          </div>
        `).join("");
      }
    } catch (err) {
      document.getElementById("stats").innerHTML = `<div class="col-12"><div class="ff-empty">${err.message}</div></div>`;
    }
  })();
</script>
</body>
</html>
