<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>User Management — FundFlow</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="../assets/css/style.css" rel="stylesheet">
</head>
<body>
<script>window.FF_BASE = "../";</script>
<div id="ff-nav"></div>

<div class="container py-5">
  <h1 class="ff-display mb-4">Users</h1>
  <ul class="nav nav-pills mb-4" id="roleTabs">
    <li class="nav-item"><button class="nav-link active" data-role="">All</button></li>
    <li class="nav-item"><button class="nav-link" data-role="DONOR">Donors</button></li>
    <li class="nav-item"><button class="nav-link" data-role="ORGANIZER">Organizers</button></li>
    <li class="nav-item"><button class="nav-link" data-role="ADMIN">Admins</button></li>
  </ul>
  <div id="list"><p class="text-secondary">Loading…</p></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/nav.js"></script>
<script>
  FundFlowApi.requireRole("ADMIN");

  async function load(role) {
    const list = document.getElementById("list");
    list.innerHTML = '<p class="text-secondary">Loading…</p>';
    try {
      const users = await FundFlowApi.get("/admin/users" + (role ? `?role=${role}` : ""));
      list.innerHTML = `
        <table class="table ff-card">
          <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Joined</th></tr></thead>
          <tbody>
            ${users.map(u => `
              <tr>
                <td>${u.fullName}</td>
                <td>${u.email}</td>
                <td><span class="ff-pill ff-pill-approved">${u.role.replace('ROLE_', '')}</span></td>
                <td class="text-secondary small">${new Date(u.createdAt).toLocaleDateString()}</td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      `;
    } catch (err) {
      list.innerHTML = `<div class="ff-empty">${err.message}</div>`;
    }
  }

  document.querySelectorAll("#roleTabs button").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll("#roleTabs button").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      load(btn.dataset.role);
    });
  });

  load("");
</script>
</body>
</html>
