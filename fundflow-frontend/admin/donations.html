<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Donations & Transactions — FundFlow</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="../assets/css/style.css" rel="stylesheet">
</head>
<body>
<script>window.FF_BASE = "../";</script>
<div id="ff-nav"></div>

<div class="container py-5">
  <h1 class="ff-display mb-4">Donations & transactions</h1>
  <div id="list"><p class="text-secondary">Loading…</p></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/nav.js"></script>
<script>
  FundFlowApi.requireRole("ADMIN");

  (async function () {
    const list = document.getElementById("list");
    try {
      const donations = await FundFlowApi.get("/admin/donations");
      if (!donations.length) {
        list.innerHTML = '<div class="ff-empty">No donations yet.</div>';
        return;
      }
      list.innerHTML = `
        <table class="table ff-card">
          <thead><tr><th>Campaign</th><th>Amount</th><th>Status</th><th>Transaction Ref</th><th>Date</th></tr></thead>
          <tbody>
            ${donations.map(d => `
              <tr>
                <td><a href="../campaign-details.html?id=${d.campaignId}">${d.campaignTitle}</a></td>
                <td>$${d.amount}</td>
                <td><span class="ff-pill ff-pill-${d.status.toLowerCase()}">${d.status}</span></td>
                <td class="text-secondary small">${d.transactionRef || "—"}</td>
                <td class="text-secondary small">${new Date(d.createdAt).toLocaleString()}</td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      `;
    } catch (err) {
      list.innerHTML = `<div class="ff-empty">${err.message}</div>`;
    }
  })();
</script>
</body>
</html>
