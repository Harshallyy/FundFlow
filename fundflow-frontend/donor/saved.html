<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Saved Campaigns — FundFlow</title>
    <meta name="robots" content="noindex, nofollow" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="../assets/css/style.css" rel="stylesheet" />
  </head>
  <body>
    <script>
      window.FF_BASE = "../";
    </script>
    <div id="ff-nav"></div>

    <div class="container py-5">
      <h1 class="ff-display mb-4">Saved campaigns</h1>
      <div id="grid" class="row g-4">
        <p class="text-secondary">Loading…</p>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/nav.js"></script>
    <script>
      FundFlowApi.requireRole("DONOR");

      (async function () {
        const grid = document.getElementById("grid");
        try {
          const campaigns = await FundFlowApi.get("/saved-campaigns");
          if (!campaigns.length) {
            grid.innerHTML =
              '<div class="col-12"><div class="ff-empty">No saved campaigns yet. <a href="../explore.html">Explore campaigns</a></div></div>';
            return;
          }
          grid.innerHTML = campaigns
            .map(
              (c) => `
        <div class="col-md-4">
          <a href="../campaign-details.html?id=${c.id}" class="text-decoration-none text-reset">
            <div class="ff-card h-100">
              <img src="${c.imagePath || "/assets/images/campaign-placeholder-default.svg"}" alt="">
              <div class="ff-card-body">
                <strong>${c.title}</strong>
                <div class="ff-progress my-2"><span style="width:${c.progressPercentage}%"></span></div>
                <div class="d-flex justify-content-between text-secondary small">
                  <span>$${c.currentAmount} of $${c.targetAmount}</span>
                  <span>${c.daysRemaining}d left</span>
                </div>
              </div>
            </div>
          </a>
        </div>
      `,
            )
            .join("");
        } catch (err) {
          grid.innerHTML = `<div class="col-12"><div class="ff-empty">${err.message}</div></div>`;
        }
      })();
    </script>
  </body>
</html>
