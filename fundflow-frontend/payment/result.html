<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Donation Receipt — FundFlow</title>
    <meta name="robots" content="noindex, nofollow" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="../assets/css/style.css" rel="stylesheet" />
  </head>
  <body>
    <script>
      window.FF_BASE = "../";
    </script>
    <div id="ff-nav"></div>

    <div class="container py-5" style="max-width: 520px" id="page"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/nav.js"></script>
    <script>
      FundFlowApi.requireAuth();
      const raw = sessionStorage.getItem("ff_last_donation");
      const page = document.getElementById("page");

      if (!raw) {
        page.innerHTML =
          '<div class="ff-empty">No recent donation to show. <a href="../donor/donations.html">View your donation history</a></div>';
      } else {
        const d = JSON.parse(raw);
        const copy = {
          SUCCESS: {
            title: "Thank you — your donation went through",
            icon: "✅",
            tone: "ff-pill-success",
          },
          PENDING: {
            title: "Your donation is pending confirmation",
            icon: "⏳",
            tone: "ff-pill-pending",
          },
          FAILED: {
            title: "Your donation could not be processed",
            icon: "⚠️",
            tone: "ff-pill-failed",
          },
        }[d.status];

        page.innerHTML = `
      <div class="ff-card p-4 text-center mb-3">
        <div style="font-size:2.5rem">${copy.icon}</div>
        <h3 class="ff-display">${copy.title}</h3>
        <span class="ff-pill ${copy.tone}">${d.status}</span>
      </div>
      <div class="ff-card p-4">
        <dl class="row mb-0">
          <dt class="col-5">Campaign</dt><dd class="col-7"><a href="../campaign-details.html?id=${d.campaignId}">${d.campaignTitle}</a></dd>
          <dt class="col-5">Amount</dt><dd class="col-7">${FundFlowApi.formatCurrency(d.amount)}</dd>
          <dt class="col-5">Payment reference</dt><dd class="col-7">${d.mockReference || "—"}</dd>
          <dt class="col-5">Transaction ref</dt><dd class="col-7">${d.transactionRef || "—"}</dd>
          <dt class="col-5">Date</dt><dd class="col-7">${new Date(d.createdAt).toLocaleString()}</dd>
        </dl>
      </div>
      <div id="campaignImpact" class="ff-card p-4 mt-3 text-center">
        <div class="text-secondary small">Refreshing campaign progress…</div>
      </div>
      ${d.status === "FAILED" ? `<a href="donate.html?campaignId=${d.campaignId}" class="btn btn-ff-primary w-100 mt-3">Try again</a>` : ""}
      <a href="../donor/donations.html" class="btn btn-ff-outline w-100 mt-2">View donation history</a>
    `;
        FundFlowApi.get(`/campaigns/${d.campaignId}`)
          .then((campaign) => {
            document.getElementById("campaignImpact").innerHTML = `
            <strong>${campaign.progressPercentage}% funded</strong>
            <div class="ff-progress my-2"><span style="width:${campaign.progressPercentage}%"></span></div>
            <div class="text-secondary small">${FundFlowApi.formatCurrency(campaign.currentAmount)} raised · ${campaign.donorCount} supporters</div>
            ${d.status === "SUCCESS" ? '<div class="text-secondary small mt-2">Your contribution is included in this campaign total.</div>' : ""}`;
          })
          .catch(() => {
            document.getElementById("campaignImpact").innerHTML =
              '<div class="text-secondary small">Campaign progress will appear when the server is available.</div>';
          });
        sessionStorage.removeItem("ff_last_donation");
      }
    </script>
  </body>
</html>
