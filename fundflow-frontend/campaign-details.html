<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Campaign Details — FundFlow</title>
    <meta
      name="description"
      content="View campaign details, progress, and ways to support this FundFlow fundraiser."
    />
    <link rel="canonical" href="./" />
    <meta property="og:title" content="Campaign Details — FundFlow" />
    <meta
      property="og:description"
      content="View campaign details and support a FundFlow fundraiser."
    />
    <meta property="og:type" content="article" />
    <meta name="twitter:card" content="summary" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="assets/css/style.css" rel="stylesheet" />
  </head>
  <body>
    <script>
      window.FF_BASE = "";
    </script>
    <div id="ff-nav"></div>

    <div class="container py-5" id="pageContent">
      <p class="text-secondary">Loading campaign…</p>
    </div>

    <footer class="ff-footer py-4">
      <div class="container">
        FundFlow — a student fundraising platform project
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/nav.js"></script>
    <script>
      const params = new URLSearchParams(window.location.search);
      const campaignId = params.get("id");
      const user = FundFlowApi.getUser();
      const pillClass = (s) => "ff-pill ff-pill-" + s.toLowerCase();

      async function loadPage() {
        const content = document.getElementById("pageContent");
        if (!campaignId) {
          content.innerHTML =
            '<div class="ff-empty">No campaign specified.</div>';
          return;
        }
        try {
          const [c, updates] = await Promise.all([
            FundFlowApi.get(`/campaigns/${campaignId}`),
            FundFlowApi.get(`/campaigns/${campaignId}/updates`),
          ]);
          document.title = `${c.title} — FundFlow`;
          document
            .querySelector('meta[name="description"]')
            .setAttribute(
              "content",
              c.description || `View ${c.title} on FundFlow.`,
            );

          const isOwner =
            user &&
            user.role === "ROLE_ORGANIZER" &&
            user.userId === c.organizerId;
          const isAdmin = user && user.role === "ROLE_ADMIN";
          const isDonor = user && user.role === "ROLE_DONOR";

          let ownerActions = "";
          if (isOwner) {
            ownerActions = `<div class="alert alert-light border mb-4">
          <strong>Status: <span class="${pillClass(c.status)}">${c.status}</span></strong>
          ${c.reviewNotes ? `<div class="mt-2 small">Admin notes: ${c.reviewNotes}</div>` : ""}
          <div class="mt-3">
            <a href="organizer/campaign-manage.html?id=${c.id}" class="btn btn-ff-outline btn-sm">Manage campaign</a>
          </div>
        </div>`;
          }

          let donateBox = "";
          if (c.status === "APPROVED" && c.daysRemaining > 0) {
            donateBox = isDonor
              ? `<a href="payment/donate.html?campaignId=${c.id}" class="btn btn-ff-accent btn-lg w-100 mb-2">Donate now</a>
             <button class="btn btn-ff-outline w-100" id="saveBtn">☆ Save campaign</button>`
              : !user
                ? `<a href="login.html" class="btn btn-ff-accent btn-lg w-100">Log in to donate</a>`
                : `<p class="text-secondary small mb-0">Only donor accounts can give to campaigns.</p>`;
          } else if (c.status === "APPROVED") {
            donateBox = `<p class="text-secondary small mb-0">This campaign's fundraising period has ended.</p>`;
          }

          content.innerHTML = `
        <div class="row g-5">
          <div class="col-lg-7">
            ${ownerActions}
            <span class="ff-pill ff-pill-category mb-2 d-inline-block">${c.category || "General"}</span>
            <h1 class="ff-display">${c.title}</h1>
            <img src="${c.imagePath || "/assets/images/campaign-placeholder-default.svg"}" class="w-100 rounded mb-4" style="max-height:320px;object-fit:cover;">
            <h5>About this campaign</h5>
            <p style="white-space: pre-line;">${c.description}</p>
            <h5 class="mt-4">Beneficiary</h5>
            <p>${c.beneficiaryName}${c.beneficiaryInfo ? " — " + c.beneficiaryInfo : ""}</p>
            <h5 class="mt-4">Updates</h5>
            <div id="updatesList">
              ${
                updates.length
                  ? updates
                      .map(
                        (u) => `
                <div class="border-bottom pb-2 mb-2">
                  <div>${u.updateText}</div>
                  <div class="text-secondary small">${new Date(u.createdAt).toLocaleDateString()}</div>
                </div>`,
                      )
                      .join("")
                  : '<p class="text-secondary">No updates posted yet.</p>'
              }
            </div>
          </div>
          <div class="col-lg-5">
            <div class="ff-card p-4">
              <div class="ff-progress mb-2"><span style="width:${c.progressPercentage}%"></span></div>
              <div class="d-flex justify-content-between mb-3">
                <strong>${FundFlowApi.formatCurrency(c.currentAmount)} raised</strong>
                <span class="text-secondary">of ${FundFlowApi.formatCurrency(c.targetAmount)}</span>
              </div>
              <div class="row text-center mb-3">
                <div class="col-4"><div class="fw-bold">${c.progressPercentage}%</div><div class="small text-secondary">funded</div></div>
                <div class="col-4"><div class="fw-bold">${c.donorCount}</div><div class="small text-secondary">donors</div></div>
                <div class="col-4"><div class="fw-bold">${c.daysRemaining}</div><div class="small text-secondary">days left</div></div>
              </div>
              ${donateBox}
            </div>
            <p class="text-secondary small mt-3">Organized by ${c.organizerName}</p>
          </div>
        </div>
      `;

          if (isDonor && c.status === "APPROVED") {
            document
              .getElementById("saveBtn")
              .addEventListener("click", async (e) => {
                try {
                  await FundFlowApi.post(`/saved-campaigns/${c.id}`, {});
                  e.target.textContent = "★ Saved";
                  e.target.disabled = true;
                } catch (err) {
                  alert(err.message);
                }
              });
          }
        } catch (err) {
          content.innerHTML = `<div class="ff-empty">${err.message || "Could not load this campaign."}</div>`;
        }
      }

      loadPage();
    </script>
  </body>
</html>
