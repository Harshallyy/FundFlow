<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign up — FundFlow</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="assets/css/style.css" rel="stylesheet">
</head>
<body>
<script>window.FF_BASE = "";</script>
<div id="ff-nav"></div>

<div class="container py-5" style="max-width: 480px;">
  <h1 class="ff-display mb-4">Create your account</h1>
  <div id="formError" class="alert alert-danger d-none"></div>
  <form id="registerForm">
    <div class="mb-3">
      <label class="form-label">Full name</label>
      <input class="form-control" id="fullName" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Email</label>
      <input type="email" class="form-control" id="email" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Password</label>
      <input type="password" class="form-control" id="password" minlength="8" required>
      <div class="form-text">At least 8 characters.</div>
    </div>
    <div class="mb-3">
      <label class="form-label">I want to...</label>
      <select class="form-select" id="role">
        <option value="DONOR">Donate to campaigns</option>
        <option value="ORGANIZER">Start a campaign</option>
      </select>
      <div class="form-text">Admin accounts aren't self-registered — they're managed separately.</div>
    </div>
    <button type="submit" class="btn btn-ff-primary w-100">Sign up</button>
  </form>
  <p class="text-secondary mt-3">Already have an account? <a href="login.html">Log in</a></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/nav.js"></script>
<script>
  document.getElementById("registerForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const errorBox = document.getElementById("formError");
    errorBox.classList.add("d-none");
    try {
      const auth = await FundFlowApi.post("/auth/register", {
        fullName: document.getElementById("fullName").value,
        email: document.getElementById("email").value,
        password: document.getElementById("password").value,
        role: document.getElementById("role").value,
      });
      FundFlowApi.setSession(auth);
      window.location.href = auth.role === "ROLE_ORGANIZER" ? "organizer/dashboard.html" : "donor/dashboard.html";
    } catch (err) {
      errorBox.textContent = err.fieldErrors ? Object.values(err.fieldErrors).join(" ") : err.message;
      errorBox.classList.remove("d-none");
    }
  });
</script>
</body>
</html>
