<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Explore Campaigns — FundFlow</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="assets/css/style.css" rel="stylesheet">
</head>
<body>
<script>window.FF_BASE = "";</script>
<div id="ff-nav"></div>

<div class="container py-5">
  <div class="row mb-4">
    <div class="col-lg-8">
      <h1 class="ff-display">Explore campaigns</h1>
      <p class="text-secondary">Every campaign shown here has already been reviewed and approved.</p>
    </div>
  </div>

  <div class="row g-2 mb-4">
    <div class="col-md-4">
      <input id="filterKeyword" class="form-control" placeholder="Search by title…">
    </div>
    <div class="col-md-3">
      <select id="filterCategory" class="form-select">
        <option value="">All categories</option>
        <option>Medical</option>
        <option>Education</option>
        <option>Disaster Relief</option>
        <option>Community</option>
        <option>Environment</option>
        <option>Other</option>
      </select>
    </div>
    <div class="col-md-2">
      <button class="btn btn-ff-primary w-100" id="applyFilters">Search</button>
    </div>
  </div>

  <div id="campaignGrid" class="row g-4">
    <p class="text-secondary">Loading campaigns…</p>
  </div>
</div>

<footer class="ff-footer py-4">
  <div class="container">FundFlow — a student fundraising platform project</div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/nav.js"></script>
<script>
  async function loadCampaigns() {
    const grid = document.getElementById("campaignGrid");
    grid.innerHTML = '<p class="text-secondary">Loading campaigns…</p>';

    const keyword = document.getElementById("filterKeyword").value.trim();
    const category = document.getElementById("filterCategory").value;
    const params = new URLSearchParams();
    if (keyword) params.set("keyword", keyword);
    if (category) params.set("category", category);

    try {
      const campaigns = await FundFlowApi.get("/campaigns/explore" + (params.toString() ? "?" + params.toString() : ""));
      if (!campaigns.length) {
        grid.innerHTML = '<div class="col-12"><div class="ff-empty">No campaigns match your search.</div></div>';
        return;
      }
      grid.innerHTML = campaigns.map(c => `
        <div class="col-md-4">
          <a href="campaign-details.html?id=${c.id}" class="text-decoration-none text-reset">
            <div class="ff-card h-100">
              <img src="${c.imagePath || '/assets/images/campaign-placeholder-default.svg'}" alt="">
              <div class="ff-card-body">
                <span class="ff-pill ff-pill-approved mb-2 d-inline-block">${c.category || "General"}</span>
                <div><strong>${c.title}</strong></div>
                <div class="ff-progress my-2"><span style="width:${c.progressPercentage}%"></span></div>
                <div class="d-flex justify-content-between text-secondary small">
                  <span>$${c.currentAmount} of $${c.targetAmount}</span>
                  <span>${c.daysRemaining}d left</span>
                </div>
              </div>
            </div>
          </a>
        </div>
      `).join("");
    } catch (err) {
      grid.innerHTML = '<div class="col-12"><div class="ff-empty">Could not load campaigns. Is the backend running?</div></div>';
    }
  }

  document.getElementById("applyFilters").addEventListener("click", loadCampaigns);
  document.getElementById("filterKeyword").addEventListener("keydown", e => { if (e.key === "Enter") loadCampaigns(); });
  loadCampaigns();
</script>
</body>
</html>
