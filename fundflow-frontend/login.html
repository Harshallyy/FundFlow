<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Log in — FundFlow</title>
    <meta name="robots" content="noindex, nofollow" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="assets/css/style.css" rel="stylesheet" />
  </head>
  <body>
    <script>
      window.FF_BASE = "";
    </script>
    <div id="ff-nav"></div>

    <div class="container py-5" style="max-width: 440px">
      <h1 class="ff-display mb-4">Log in</h1>
      <div id="formError" class="alert alert-danger d-none"></div>
      <form id="loginForm">
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" id="email" required />
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" class="form-control" id="password" required />
        </div>
        <button type="submit" class="btn btn-ff-primary w-100">Log in</button>
      </form>
      <p class="text-secondary mt-3">
        No account? <a href="register.html">Sign up</a>
      </p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/nav.js"></script>
    <script>
      document
        .getElementById("loginForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const errorBox = document.getElementById("formError");
          errorBox.classList.add("d-none");
          try {
            const auth = await FundFlowApi.post("/auth/login", {
              email: document.getElementById("email").value,
              password: document.getElementById("password").value,
            });
            FundFlowApi.setSession(auth);
            if (auth.role === "ROLE_DONOR")
              window.location.href = "donor/dashboard.html";
            else if (auth.role === "ROLE_ORGANIZER")
              window.location.href = "organizer/dashboard.html";
            else window.location.href = "admin/dashboard.html";
          } catch (err) {
            errorBox.textContent = err.message;
            errorBox.classList.remove("d-none");
          }
        });
    </script>
  </body>
</html>
