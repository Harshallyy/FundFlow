<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Help Assistant — FundFlow</title>
    <meta name="robots" content="noindex, nofollow" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="../assets/css/style.css" rel="stylesheet" />
  </head>
  <body>
    <script>
      window.FF_BASE = "../";
    </script>
    <div id="ff-nav"></div>

    <div class="container py-5" style="max-width: 640px">
      <h1 class="ff-display mb-2">FundFlow help assistant</h1>
      <p class="text-secondary mb-4">
        Ask how FundFlow works — donating, creating a campaign, approvals,
        payment status, and more.
      </p>

      <div id="chatLog" class="mb-3" style="min-height: 200px">
        <div class="ff-card p-3 mb-2">
          <strong>Assistant:</strong> Hi! Ask me anything about how FundFlow
          works.
        </div>
      </div>

      <form id="chatForm" class="d-flex gap-2">
        <input
          class="form-control"
          id="messageInput"
          placeholder="e.g. How can I donate?"
          required
        />
        <button class="btn btn-ff-primary" type="submit">Ask</button>
      </form>
      <p class="text-secondary small mt-2">
        Requires Ollama running locally with the configured model — see the
        README.
      </p>

      <div class="mt-4">
        <strong class="small">Try asking:</strong>
        <div class="mt-2 d-flex flex-wrap gap-2">
          <button class="btn btn-ff-outline btn-sm sample-q">
            How does FundFlow work?
          </button>
          <button class="btn btn-ff-outline btn-sm sample-q">
            How can I donate?
          </button>
          <button class="btn btn-ff-outline btn-sm sample-q">
            How can I create a campaign?
          </button>
          <button class="btn btn-ff-outline btn-sm sample-q">
            What does campaign approval mean?
          </button>
          <button class="btn btn-ff-outline btn-sm sample-q">
            What does payment pending mean?
          </button>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/nav.js"></script>
    <script>
      const log = document.getElementById("chatLog");

      function appendMessage(who, text) {
        const div = document.createElement("div");
        div.className = "ff-card p-3 mb-2";
        div.innerHTML = `<strong></strong> <span></span>`;
        div.querySelector("strong").textContent = who + ":";
        div.querySelector("span").textContent = text;
        log.appendChild(div);
        log.scrollTop = log.scrollHeight;
      }

      async function ask(message) {
        appendMessage("You", message);
        const thinking = document.createElement("div");
        thinking.className = "text-secondary small mb-2";
        thinking.textContent = "Assistant is thinking…";
        log.appendChild(thinking);
        try {
          const result = await FundFlowApi.request("/ai/assistant", {
            method: "POST",
            body: { message },
            auth: false,
          });
          thinking.remove();
          appendMessage("Assistant", result.reply);
        } catch (err) {
          thinking.remove();
          appendMessage(
            "Assistant",
            "Sorry, I couldn't reach the AI service. Is Ollama running? (" +
              err.message +
              ")",
          );
        }
      }

      document.getElementById("chatForm").addEventListener("submit", (e) => {
        e.preventDefault();
        const input = document.getElementById("messageInput");
        if (!input.value.trim()) return;
        ask(input.value.trim());
        input.value = "";
      });

      document
        .querySelectorAll(".sample-q")
        .forEach((btn) =>
          btn.addEventListener("click", () => ask(btn.textContent)),
        );
    </script>
  </body>
</html>
