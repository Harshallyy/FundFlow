<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>My Campaigns — FundFlow</title>
    <meta name="robots" content="noindex, nofollow" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="../assets/css/style.css" rel="stylesheet" />
  </head>
  <body>
    <script>
      window.FF_BASE = "../";
    </script>
    <div id="ff-nav"></div>

    <div class="container py-5">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="ff-display mb-0">My campaigns</h1>
        <a href="create-campaign.html" class="btn btn-ff-accent"
          >+ New campaign</a
        >
      </div>
      <div id="list"><p class="text-secondary">Loading…</p></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/nav.js"></script>
    <script>
      FundFlowApi.requireRole("ORGANIZER");
      const pillClass = (s) => "ff-pill ff-pill-" + s.toLowerCase();

      (async function () {
        const list = document.getElementById("list");
        try {
          const campaigns = await FundFlowApi.get("/campaigns/mine");
          if (!campaigns.length) {
            list.innerHTML =
              '<div class="ff-empty">You haven\'t created a campaign yet. <a href="create-campaign.html">Start one</a></div>';
            return;
          }
          list.innerHTML = campaigns
            .map(
              (c) => `
        <div class="ff-card p-3 mb-2 d-flex justify-content-between align-items-center">
          <div class="d-flex align-items-center gap-3">
            <img src="${c.imagePath || "/assets/images/campaign-placeholder-default.svg"}" style="width:64px;height:48px;object-fit:cover;border-radius:6px;">
            <div>
              <a href="campaign-manage.html?id=${c.id}">${c.title}</a>
              <div class="text-secondary small">$${c.currentAmount} of $${c.targetAmount} · ${c.progressPercentage}% funded</div>
            </div>
          </div>
          <div class="text-end">
            <span class="${pillClass(c.status)}">${c.status}</span>
            <div class="mt-1"><a href="campaign-manage.html?id=${c.id}" class="small">Manage</a></div>
          </div>
        </div>
      `,
            )
            .join("");
        } catch (err) {
          list.innerHTML = `<div class="ff-empty">${err.message}</div>`;
        }
      })();
    </script>
  </body>
</html>
