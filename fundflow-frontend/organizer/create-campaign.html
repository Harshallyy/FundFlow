<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>New Campaign — FundFlow</title>
    <meta name="robots" content="noindex, nofollow" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="../assets/css/style.css" rel="stylesheet" />
  </head>
  <body>
    <script>
      window.FF_BASE = "../";
    </script>
    <div id="ff-nav"></div>

    <div class="container py-5" style="max-width: 720px">
      <h1 class="ff-display mb-2">Start a campaign</h1>
      <p class="text-secondary mb-4">
        This saves as a draft first — you'll submit it for admin review when
        you're ready.
      </p>
      <div id="formError" class="alert alert-danger d-none"></div>

      <form id="campaignForm">
        <div class="row g-3">
          <div class="col-md-8">
            <label class="form-label">Title</label>
            <input class="form-control" id="title" required />
          </div>
          <div class="col-md-4">
            <label class="form-label">Category</label>
            <select class="form-select" id="category">
              <option>Medical</option>
              <option>Education</option>
              <option>Disaster Relief</option>
              <option>Community</option>
              <option>Environment</option>
              <option>Other</option>
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label">Target amount (₹)</label>
            <input
              type="number"
              min="1"
              step="0.01"
              class="form-control"
              id="targetAmount"
              required
            />
          </div>
          <div class="col-md-6">
            <label class="form-label">Cover image</label>
            <select class="form-select" id="imagePath">
              <option value="/assets/images/campaign-placeholder-default.svg">
                General
              </option>
              <option value="/assets/images/campaign-medical.svg">
                Medical
              </option>
              <option value="/assets/images/campaign-education.svg">
                Education
              </option>
              <option value="/assets/images/campaign-disaster-relief.svg">
                Disaster relief
              </option>
              <option value="/assets/images/campaign-community.svg">
                Community
              </option>
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label">Start date</label>
            <input type="date" class="form-control" id="startDate" required />
          </div>
          <div class="col-md-6">
            <label class="form-label">End date</label>
            <input type="date" class="form-control" id="endDate" required />
          </div>
          <div class="col-md-6">
            <label class="form-label">Beneficiary name</label>
            <input class="form-control" id="beneficiaryName" required />
          </div>
          <div class="col-md-6">
            <label class="form-label">Beneficiary details (optional)</label>
            <input class="form-control" id="beneficiaryInfo" />
          </div>
        </div>

        <hr class="my-4" />

        <div class="ff-card p-3 mb-3">
          <h6>Need help writing the description?</h6>
          <p class="text-secondary small">
            Fill in the basics and the AI assistant will draft one — you can
            edit or regenerate before saving.
          </p>
          <div class="row g-2">
            <div class="col-md-6">
              <input
                class="form-control form-control-sm"
                id="aiGoal"
                placeholder="Goal, e.g. 'raise ₹5,000 for surgery'"
              />
            </div>
            <div class="col-md-6">
              <input
                class="form-control form-control-sm"
                id="aiDetails"
                placeholder="Any extra details (optional)"
              />
            </div>
          </div>
          <button
            type="button"
            class="btn btn-ff-outline btn-sm mt-2"
            id="generateBtn"
          >
            <span class="btn-label">Generate with AI</span>
          </button>
          <span id="aiStatus" class="text-secondary small ms-2"></span>
        </div>

        <label class="form-label">Description</label>
        <textarea
          class="form-control mb-4"
          id="description"
          rows="7"
          required
        ></textarea>

        <button type="submit" class="btn btn-ff-primary">Save as draft</button>
        <a href="dashboard.html" class="btn btn-ff-outline">Cancel</a>
      </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/nav.js"></script>
    <script>
      FundFlowApi.requireRole("ORGANIZER");

      document
        .getElementById("generateBtn")
        .addEventListener("click", async () => {
          const status = document.getElementById("aiStatus");
          const button = document.getElementById("generateBtn");
          const title = document.getElementById("title").value;
          const category = document.getElementById("category").value;
          const beneficiary = document.getElementById("beneficiaryName").value;
          const goal = document.getElementById("aiGoal").value;

          if (!title || !beneficiary || !goal) {
            status.textContent = "Fill in title, beneficiary, and goal first.";
            status.className = "text-danger small ms-2";
            return;
          }

          status.textContent = "Generating… (requires Ollama running locally)";
          status.className = "text-secondary small ms-2";
          button.disabled = true;
          button.querySelector(".btn-label").textContent = "Generating…";
          try {
            const result = await FundFlowApi.post("/ai/generate-description", {
              title,
              cause: category,
              beneficiary,
              goal,
              importantDetails: document.getElementById("aiDetails").value,
            });
            document.getElementById("description").value =
              result.generatedDescription;
            status.textContent = "Generated — feel free to edit before saving.";
          } catch (err) {
            status.textContent = "Could not generate: " + err.message;
            status.className = "text-danger small ms-2";
          } finally {
            button.disabled = false;
            button.querySelector(".btn-label").textContent = "Generate with AI";
          }
        });

      document
        .getElementById("campaignForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const errorBox = document.getElementById("formError");
          errorBox.classList.add("d-none");
          try {
            const campaign = await FundFlowApi.post("/campaigns", {
              title: document.getElementById("title").value,
              description: document.getElementById("description").value,
              category: document.getElementById("category").value,
              targetAmount: parseFloat(
                document.getElementById("targetAmount").value,
              ),
              startDate: document.getElementById("startDate").value,
              endDate: document.getElementById("endDate").value,
              beneficiaryName: document.getElementById("beneficiaryName").value,
              beneficiaryInfo: document.getElementById("beneficiaryInfo").value,
              imagePath: document.getElementById("imagePath").value,
            });
            window.location.href = `campaign-manage.html?id=${campaign.id}`;
          } catch (err) {
            errorBox.textContent = err.fieldErrors
              ? Object.values(err.fieldErrors).join(" ")
              : err.message;
            errorBox.classList.remove("d-none");
          }
        });
    </script>
  </body>
</html>
