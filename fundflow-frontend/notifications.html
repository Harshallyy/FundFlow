<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Notifications — FundFlow</title>
    <meta name="robots" content="noindex, nofollow" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="assets/css/style.css" rel="stylesheet" />
  </head>
  <body>
    <script>
      window.FF_BASE = "";
    </script>
    <div id="ff-nav"></div>

    <div class="container py-5" style="max-width: 720px">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="ff-display mb-0">Notifications</h1>
        <button class="btn btn-ff-outline btn-sm" id="markAllBtn">
          Mark all as read
        </button>
      </div>
      <div id="list"><p class="text-secondary">Loading…</p></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/nav.js"></script>
    <script>
      FundFlowApi.requireAuth();

      async function load() {
        const list = document.getElementById("list");
        try {
          const notifications = await FundFlowApi.get("/notifications");
          if (!notifications.length) {
            list.innerHTML =
              '<div class="ff-empty"><div class="ff-empty-icon mx-auto mb-2" aria-hidden="true">&#10003;</div><strong>No notifications for now</strong><div class="text-secondary mt-1">You\'re all caught up!</div></div>';
            return;
          }
          const escapeHtml = (value) =>
            String(value ?? "").replace(
              /[&<>"']/g,
              (character) =>
                ({
                  "&": "&amp;",
                  "<": "&lt;",
                  ">": "&gt;",
                  '"': "&quot;",
                  "'": "&#39;",
                })[character],
            );
          list.innerHTML = notifications
            .map(
              (n) => `
        <div class="ff-card mb-2 p-3 d-flex justify-content-between align-items-start ${n.read ? "" : "border-2"}" style="${n.read ? "" : "border-color: var(--ff-brand);"}">
          <div>
            <div>${escapeHtml(FundFlowApi.formatNotificationMessage(n.message))}</div>
            <div class="text-secondary small">${new Date(n.createdAt).toLocaleString()} · ${escapeHtml((n.type || "NOTICE").replaceAll("_", " "))}</div>
          </div>
          ${n.read ? "" : `<button class="btn btn-sm btn-ff-outline" onclick="markRead(${n.id})">Mark read</button>`}
        </div>
      `,
            )
            .join("");
        } catch (err) {
          list.innerHTML = `<div class="ff-empty">${err.message}</div>`;
        }
      }

      async function markRead(id) {
        try {
          await FundFlowApi.put(`/notifications/${id}/read`);
          load();
        } catch (err) {
          alert(err.message);
        }
      }

      document
        .getElementById("markAllBtn")
        .addEventListener("click", async () => {
          try {
            await FundFlowApi.put("/notifications/read-all");
            load();
          } catch (err) {
            alert(err.message);
          }
        });

      load();
    </script>
  </body>
</html>
