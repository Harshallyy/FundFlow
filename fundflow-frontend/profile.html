<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>My Profile — FundFlow</title>
    <meta name="robots" content="noindex, nofollow" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="assets/css/style.css" rel="stylesheet" />
  </head>
  <body>
    <script>
      window.FF_BASE = "";
    </script>
    <div id="ff-nav"></div>

    <div class="container py-5" style="max-width: 560px">
      <h1 class="ff-display mb-4">My profile</h1>
      <div id="content" class="ff-card p-4">
        <p class="text-secondary mb-0">Loading…</p>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/nav.js"></script>
    <script>
      FundFlowApi.requireAuth();

      (async function () {
        const content = document.getElementById("content");
        try {
          const u = await FundFlowApi.get("/users/me");
          content.innerHTML = `
        <dl class="row mb-0">
          <dt class="col-4">Name</dt><dd class="col-8">${u.fullName}</dd>
          <dt class="col-4">Email</dt><dd class="col-8">${u.email}</dd>
          <dt class="col-4">Role</dt><dd class="col-8"><span class="ff-pill ff-pill-approved">${u.role.replace("ROLE_", "")}</span></dd>
          <dt class="col-4">Member since</dt><dd class="col-8">${new Date(u.createdAt).toLocaleDateString()}</dd>
        </dl>
      `;
        } catch (err) {
          content.innerHTML = `<p class="text-danger mb-0">${err.message}</p>`;
        }
      })();
    </script>
  </body>
</html>
